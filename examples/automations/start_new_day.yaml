# Example automation to reset manual/once chores at 2am
#
# Daily and weekly chores reset themselves automatically - see the
# new_day_time/new_week_day/new_week_time settings (admin panel's Settings
# tab, or the simple_chores.update_settings service). No automation is
# needed for those.
#
# This automation calls the simple_chores.start_new_day service daily at
# 2:00 AM to reset whatever it still covers:
#
# - Manual chores: Reset from Complete to Not Requested
# - Once chores: Deleted entirely after completion
#
# To use this automation in Home Assistant:
# 1. Copy this file to your Home Assistant config/automations directory, or
# 2. Add the automation to your automations.yaml file, or
# 3. Create it through the Home Assistant UI (Settings > Automations & Scenes > Create Automation)

automation:
  - alias: "Simple Chores: Start New Day"
    description: "Reset manual/once chores daily at 2:00 AM"

    trigger:
      - platform: time
        at: "02:00:00"

    action:
      - service: simple_chores.start_new_day
        data: {}

    mode: single

# Alternative: Reset chores for a specific user only
# Uncomment and modify the automation below if you want to reset chores
# for specific users at different times
