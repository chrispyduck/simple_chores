# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Dependabot should not update Home Assistant as that should match the homeassistant key in hacs.json
      - dependency-name: "homeassistant"
      # pytest-homeassistant pins an exact homeassistant version, so it must be bumped together with it
      - dependency-name: "pytest-homeassistant"
      # Pinned exactly by pytest-homeassistant; bumping them alone makes requirements.txt unresolvable
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
